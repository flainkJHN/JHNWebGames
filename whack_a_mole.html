<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mouse Fairground Sound Edition</title><style>body{font-family:Arial;text-align:center;background:linear-gradient(#87CEEB,#5cb85c);padding:20px}#panel{background:#fff;max-width:1000px;margin:auto;padding:15px;border-radius:12px}.bunting{font-size:28px}#game{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;max-width:750px;margin:20px auto}.hole{height:150px;background:#6b4f2a;border-radius:50%;position:relative;overflow:hidden}.mole{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;border-radius:50%;cursor:pointer}.red{background:#e53935}.blue{background:#1e88e5}.green{background:#43a047}.mole:after{content:'👀';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:42px}.tutorial{background:#fff3cd;padding:10px;border-radius:8px}.starburst{animation:star .5s forwards}.explode{animation:boom .4s forwards}.sparkle{animation:spark .7s forwards}@keyframes star{0%{transform:translateX(-50%) scale(1)}50%{box-shadow:0 0 30px 15px yellow}100%{transform:translateX(-50%) scale(1.8);opacity:0}}@keyframes boom{100%{transform:translateX(-50%) scale(2.5);opacity:0}}@keyframes spark{50%{box-shadow:0 0 25px 12px gold}100%{transform:translateX(-50%) scale(.2);opacity:0}}</style></head><body><div class=bunting>🎪🎟️🎡🎠🎪🎟️🎡🎠</div><div id=panel><h1>🎪 Mouse Fairground</h1><h2 id=level></h2><div id=tutorial class=tutorial></div><div>Score <span id=score>0</span>/15</div><div>Slow <input id=speed type=range min=1 max=5 value=5> Fast <span id=speedText></span></div><div id=game></div></div><script>let audio=new(window.AudioContext||window.webkitAudioContext)();function beep(f,d){let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;o.start();g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}let level=1,score=0,timer;const game=document.getElementById('game');const holes=[];for(let i=0;i<9;i++){let h=document.createElement('div');h.className='hole';game.appendChild(h);holes.push(h)}const scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),tutorial=document.getElementById('tutorial'),speed=document.getElementById('speed'),speedText=document.getElementById('speedText');function cfg(){let v=+speed.value;return{spawn:2200-v*350,visible:3400-v*500}}function msize(){return level<=3?90:level===4?70:55}function restart(){speedText.textContent=['Very Slow','Slow','Medium','Fast','Fastest'][speed.value-1];clearInterval(timer);timer=setInterval(spawn,cfg().spawn)}speed.oninput=restart;function setup(){score=0;scoreEl.textContent=0;levelEl.textContent='Level '+level;tutorial.textContent=['','🔴 Single click red','🔴 + 🔵','🔴 + 🔵 + 🟢','Smaller moles','Tiny moles'][level]}function advance(){if(level<5){beep(900,.2);level++;setup()}else{beep(1200,.5);alert('🏆 Complete!')}}function add(){score++;scoreEl.textContent=score;if(score>=15)advance()}function spawn(){let hole=holes[Math.floor(Math.random()*holes.length)],m=document.createElement('div');let s=msize();m.style.width=s+'px';m.style.height=s+'px';let type='red';if(level===2)type=Math.random()<.5?'red':'blue';else if(level>=3){let r=Math.random();type=r<.33?'red':r<.66?'blue':'green'}m.className='mole '+type;hole.appendChild(m);let done=false;function finish(){if(done)return;done=true;add();setTimeout(()=>m.remove(),500)}m.onclick=()=>{if(type==='red'){beep(700,.1);m.innerHTML='⭐';m.classList.add('starburst');finish()}};m.ondblclick=e=>{if(type==='blue'){e.stopPropagation();beep(300,.15);m.innerHTML='💥';m.classList.add('explode');finish()}};m.oncontextmenu=e=>{e.preventDefault();if(type==='green'){beep(1000,.15);m.innerHTML='✨';m.classList.add('sparkle');finish()}};setTimeout(()=>{if(!done&&m.parentNode)m.remove()},cfg().visible)}setup();restart();spawn();</script></body></html>
